<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Sharples Family Tree</title>
<meta name="description" content="An interactive family tree of the Sharples family of Lancashire.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23234e52'/%3E%3Cpath d='M16 7v18M9 13h14M11 19h10' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1>The Sharples Family Tree</h1>
      <p class="sub" id="stats">Loading…</p>
    </div>
  </div>
  <div class="tools">
    <div class="search">
      <input id="q" type="search" placeholder="Find a person…" autocomplete="off" aria-label="Find a person">
      <ul id="results" role="listbox" hidden></ul>
    </div>
    <button id="lineBtn" class="btn" aria-pressed="false" title="Highlight the direct paternal and maternal line">Direct line</button>
    <button id="fitBtn" class="btn icon" title="Show the whole tree" aria-label="Show the whole tree">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<main id="stage">
  <svg id="canvas" role="img" aria-label="Family tree diagram"></svg>
  <div id="gens" aria-hidden="true"></div>
  <div id="tip" role="tooltip" hidden></div>
  <canvas id="mini" aria-label="Overview map — click or drag to move around"></canvas>
  <div class="zoomctl">
    <button class="btn icon" id="zin" aria-label="Zoom in">+</button>
    <button class="btn icon" id="zout" aria-label="Zoom out">−</button>
  </div>
  <div class="legend">
    <span><i class="sw m"></i>Male</span><span><i class="sw f"></i>Female</span>
    <span><i class="sw l"></i>Living (name only)</span><span><i class="sw d"></i>Direct line</span>
    <span class="hint">Scroll or pinch to zoom · drag to pan · click a person for details</span>
  </div>
</main>

<aside id="panel" aria-live="polite" hidden>
  <button class="close" id="closeBtn" aria-label="Close">×</button>
  <div id="panelBody"></div>
</aside>

<script src="vendor/d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
